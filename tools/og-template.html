<!doctype html><html lang="hy"><head><meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
html,body{margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;background:#08090C;position:relative;font-family:'Noto Sans Armenian',sans-serif}
.g{position:absolute;border-radius:50%;filter:blur(120px)}
.g1{width:720px;height:720px;top:-260px;left:-200px;background:radial-gradient(circle,rgba(216,35,44,.55),transparent 66%)}
.g2{width:660px;height:660px;top:180px;right:-220px;background:radial-gradient(circle,rgba(34,57,127,.75),transparent 66%)}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0);background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 30% 20%,#000 10%,transparent 72%)}
.wrap{position:relative;padding:66px 74px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:46px;box-sizing:border-box}
.lg{--lw:172px;display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1}
.lg svg{display:block;width:var(--lw);height:auto}
.lgw{font-family:'Manrope',sans-serif;font-weight:800;text-transform:uppercase;color:#fff;
  font-size:calc(var(--lw)*.142);letter-spacing:calc(var(--lw)*.0165);
  margin-left:calc(var(--lw)*.245);margin-top:calc(var(--lw)*-.132);padding-bottom:calc(var(--lw)*.055);position:relative}
.lgw::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#D8232C,#8E1016);border-radius:2px}
h1{font-size:52px;font-weight:800;line-height:1.12;letter-spacing:-.02em;color:#F1F3F8;margin:0;max-width:1046px}
h1 em{font-style:normal;background:linear-gradient(96deg,#F58A78,#E5343C 28%,#C93A6B 52%,#3F6BE6 80%,#57BFF0);-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.04);color:#F1F3F8;font-size:21px;font-weight:700}
.pill b{font-family:'JetBrains Mono',monospace;letter-spacing:-.02em}
.pill small{color:#A3AAB9;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.pill--red{background:linear-gradient(180deg,#E43840,#BE1A22);border-color:transparent;box-shadow:0 14px 40px -18px rgba(216,35,44,.9)}
.pill--red small{color:rgba(255,255,255,.75)}
.oglogos{display:flex;gap:34px;color:#7A8394;font-family:'Manrope',sans-serif;font-size:19px;font-weight:600;letter-spacing:.04em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<span class="g g1"></span><span class="g g2"></span><span class="grid"></span>
<svg width="0" height="0" style="position:absolute"><defs>
  <g id="i-pin"><path d="M12 21.5s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10.3" r="2.6"/></g>
  <g id="i-call"><path d="M6.4 3.5h3l1.6 4-2 1.4a11.4 11.4 0 0 0 5.9 5.9l1.4-2 4 1.6v3a2 2 0 0 1-2.2 2A16.4 16.4 0 0 1 4.4 5.7a2 2 0 0 1 2-2.2Z"/></g>
</defs></svg>
<div class="wrap">
  <div class="lg">
    <svg viewBox="0 0 257 164">
      <defs>
        <clipPath id="A"><path d="M59 0 95 0 142.9 115 103.6 115 76 46 57.1 95 84.2 95 89.5 115 49.4 115 29.5 164 7.5 164 0 148Z"/></clipPath>
        <clipPath id="M"><path d="M113.5 0 138.5 0 178.5 88 226.5 0 243.5 0 256.5 25 256.5 115 227.5 115 226.5 63 195.5 115 157.5 115Z"/></clipPath>
      </defs>
      <g clip-path="url(#A)">
        <rect x="-2" y="-2" width="261" height="168" fill="#C4212A"/>
        <path d="M-2 170 62 -2 34 170Z" fill="#DE5F57"/><path d="M34 170 62 -2 78 44 52 170Z" fill="#C82830"/>
        <path d="M62 -2 98 -2 78 44Z" fill="#E1685F"/><path d="M95 -2 112 60 104 118 86 40Z" fill="#A7161D"/>
        <path d="M95 -2 146 118 112 60Z" fill="#BF2029"/><path d="M112 60 146 118 120 118Z" fill="#D33840"/>
        <path d="M-2 104 54 118 18 170Z" fill="#8C1016"/><path d="M-2 128 36 170 -2 170Z" fill="#68090F"/>
        <path d="M46 94 88 90 92 118 44 118Z" fill="#AC1920"/><path d="M46 94 88 90 88 98 48 100Z" fill="#CE3038"/>
      </g>
      <g clip-path="url(#M)">
        <rect x="110" y="-2" width="149" height="168" fill="#22397F"/>
        <path d="M120 -2 139 -2 179 90 157 90Z" fill="#1691CE"/><path d="M110 -2 121 -2 158 92 149 118Z" fill="#1B3574"/>
        <path d="M179 88 228 -2 244 -2 200 118Z" fill="#254497"/><path d="M186 118 228 20 228 66 198 118Z" fill="#1C3272"/>
        <path d="M244 -2 259 27 240 46Z" fill="#7396DE"/><path d="M246 40 259 24 259 118 242 118Z" fill="#5077C8"/>
        <path d="M228 24 246 40 242 118 228 118Z" fill="#20397E"/>
      </g>
    </svg>
    <span class="lgw">Service</span>
  </div>

  <h1>Հեռախոսների վաճառք<br><em>և պրոֆեսիոնալ վերանորոգում</em></h1>

  <div class="row">
    <span class="pill pill--red"><svg class="ic" viewBox="0 0 24 24"><use href="#i-call"/></svg><span><small>Վերանորոգում</small> <b>041 88 77 33</b></span></span>
    <span class="pill"><svg class="ic" viewBox="0 0 24 24"><use href="#i-call"/></svg><span><small>Առք և վաճառք</small> <b>094 20 97 99</b></span></span>
    <span class="pill"><svg class="ic" viewBox="0 0 24 24"><use href="#i-pin"/></svg><span>Նալբանդյան 50</span></span>

  <div class="oglogos" style="margin-top:6px"><span>Apple</span><span>SAMSUNG</span><span>Xiaomi</span><span>HONOR</span><span>OPPO</span><span>realme</span></div>

</body></html>
